<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/p5.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/addons/p5.sound.min.js"></script>
	<script src="https://unpkg.com/ml5@1.3.0/dist/ml5.js"></script>
	<script src="trackerstuff.js"></script>
	<script src="particles.js"></script>
	<script src="snow.js"></script>
	<script src="sketch.js"></script>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
	<div id="particle-controls">
		<h3>Particle Controls</h3>
		<div class="control-group">
			<label>Word Interval: <span id="interval-val">500</span>ms</label>
			<input type="range" id="interval" min="100" max="2000" step="50" value="500">
		</div>
		<div class="control-group">
			<label>Push Force: <span id="push-val">20</span></label>
			<input type="range" id="push" min="1" max="50" step="1" value="20">
		</div>
		<div class="control-group">
			<label>Home Force: <span id="home-val">0.0015</span></label>
			<input type="range" id="home" min="0.0005" max="0.01" step="0.0005" value="0.0015">
		</div>
		<div class="control-group">
			<label>Damping: <span id="damping-val">0.8</span></label>
			<input type="range" id="damping" min="0.5" max="0.99" step="0.01" value="0.8">
		</div>
	</div>
	<div id="snow-controls">
		<h3>Snow Controls</h3>
		<div class="control-group">
			<label>Gravity: <span id="gravity-val">1</span></label>
			<input type="range" id="gravity" min="0" max="3" step="0.1" value="1">
		</div>
		<div class="control-group">
			<label>Size: <span id="size-val">0.85</span></label>
			<input type="range" id="size" min="0.1" max="5" step="0.05" value="0.85">
		</div>
		<div class="control-group">
			<label>Repel Radius: <span id="repel-val">30</span></label>
			<input type="range" id="repel" min="0" max="150" step="5" value="30">
		</div>
		<div class="control-group">
			<label>Attraction: <span id="attraction-val">1.5</span></label>
			<input type="range" id="attraction" min="0" max="5" step="0.1" value="1.5">
		</div>
		<div class="control-group">
			<label>Trail Alpha: <span id="trail-val">40</span></label>
			<input type="range" id="trail" min="5" max="100" step="5" value="40">
		</div>
		<div class="control-group">
			<label>Turbulence: <span id="turbulence-val">0.15</span></label>
			<input type="range" id="turbulence" min="0" max="1" step="0.05" value="0.15">
		</div>
	</div>
</body>

</html>
